name: Validate Knowledge Base

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kb-content-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-kb:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HUSKY: '0'
      SKIP_ENV_VALIDATION: '1'
      KB_CONTENT_SOURCE: pin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install website dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Prepare and validate pinned article sources
        run: yarn kb:build:prepare
      - name: Run content and rendering regressions
        run: node scripts/test-website.mjs
      - name: Build production output without publishing
        run: yarn build
